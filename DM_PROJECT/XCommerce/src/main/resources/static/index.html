<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XCommerce</title>
    <style>
        :root {
          --bg: #fff4f6;
          --bg2: #fff;
          --text: #111827;
          --muted: #6b7280;
          --border: rgba(17, 24, 39, 0.08);
          --shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
          --shadow2: 0 6px 18px rgba(17, 24, 39, 0.08);
          --brand: #ff3f6c;
          --brand2: #ff7a59;
          --chip: rgba(255, 63, 108, 0.12);
        }

        * {
          box-sizing: border-box;
        }

        body {
          font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
            Arial, "Noto Sans", "Liberation Sans", sans-serif;
          margin: 0;
          color: var(--text);
          background: radial-gradient(
              1200px 700px at 15% -5%,
              #ffe2ea 0%,
              rgba(255, 226, 234, 0) 55%
            ),
            radial-gradient(
              900px 550px at 85% 5%,
              #ffe7df 0%,
              rgba(255, 231, 223, 0) 45%
            ),
            linear-gradient(180deg, #fff 0%, #fff4f6 75%, #fff 100%);
          font-size: 15px;
          min-height: 100vh;
        }

        .topbar {
          position: sticky;
          top: 0;
          z-index: 50;
          background: rgba(255, 255, 255, 0.72);
          backdrop-filter: blur(14px);
          border-bottom: 1px solid var(--border);
        }

        .topbarInner {
          max-width: 1400px;
          margin: 0 auto;
          padding: 18px 26px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          gap: 14px;
        }

        .brand {
          display: flex;
          align-items: center;
          gap: 10px;
        }

        .logo {
          width: 46px;
          height: 46px;
          border-radius: 12px;
          background: linear-gradient(135deg, var(--brand) 0%, var(--brand2) 100%);
          box-shadow: 0 8px 20px rgba(255, 63, 108, 0.25);
        }

        .brandTitle {
          display: grid;
          line-height: 1.1;
        }

        .brandTitle strong {
          font-size: 20px;
          letter-spacing: 0.2px;
        }

        .brandTitle span {
          font-size: 13px;
          color: var(--muted);
        }

        .pill {
          border: 1px solid var(--border);
          background: rgba(255, 255, 255, 0.9);
          border-radius: 999px;
          padding: 8px 12px;
          color: var(--muted);
          font-size: 12px;
        }

        .page {
          max-width: 1400px;
          margin: 0 auto;
          padding: 24px 26px 34px;
          display: grid;
          place-items: center;
          min-height: calc(100vh - 86px);
        }

        .panel {
          width: min(820px, 100%);
          background: rgba(255, 255, 255, 0.92);
          border: 1px solid var(--border);
          border-radius: 16px;
          box-shadow: var(--shadow2);
          overflow: hidden;
        }

        .panelBody {
          padding: 18px 18px 20px;
        }

        h1 {
          margin: 0;
          font-size: 34px;
          letter-spacing: 0.1px;
          line-height: 1.15;
        }

        .heroTitle {
          display: grid;
          gap: 6px;
          justify-items: center;
          text-align: center;
        }

        .heroTitle .brandWord {
          font-size: 38px;
          letter-spacing: 0.2px;
          margin-bottom: 12px; /* space below XCommerce */
        }

        .heroTitle .tagline {
          font-size: 18px;
          font-weight: 750;
          color: #374151;
          margin-bottom: 24px; /* space below tagline before buttons */
        }

        p.sub {
          margin: 10px 0 0;
          color: var(--muted);
          font-size: 13px;
          line-height: 1.5;
        }

        .cards {
          margin-top: 16px;
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 12px;
        }

        .card {
          padding: 0;
          background: transparent;
          border: none;
          box-shadow: none;
        }

        a {
          text-decoration: none;
        }

        button {
          width: 100%;
          padding: 14px 14px;
          border-radius: 12px;
          border: 1px solid rgba(255, 63, 108, 0.55);
          background: linear-gradient(135deg, var(--brand) 0%, var(--brand2) 100%);
          color: white;
          cursor: pointer;
          font-weight: 750;
          letter-spacing: 0.1px;
          box-shadow: 0 10px 18px rgba(255, 63, 108, 0.2);
          font-size: 15px;
        }

        button.secondary {
          background: rgba(255, 255, 255, 0.95);
          color: var(--text);
          border: 1px solid var(--border);
          box-shadow: none;
        }

        .footerHint {
          margin-top: 14px;
          color: var(--muted);
          font-size: 12px;
          text-align: center;
        }

        @media (max-width: 860px) {
          .cards {
            grid-template-columns: 1fr;
          }
        }
    </style>
</head>
<body>
<div class="topbar">
    <div class="topbarInner">
        <div class="brand">
            <div class="logo"></div>
            <div class="brandTitle">
                <strong>XCommerce</strong>
                <span>Unified commerce discovery</span>
            </div>
        </div>
        <div class="pill">One platform for products + partners</div>
    </div>
</div>

<div class="page">
    <div class="panel">
        <div class="panelBody">
            <h1 class="heroTitle">
                <span class="brandWord">XCommerce</span>
                <span class="tagline">Stop searching, start choosing — unified partner offers at your fingertips.</span>
            </h1>

            <div class="cards">
                <div class="card">
                    <a href="/product-search.html"><button type="button">Explore products</button></a>
                </div>

                <div class="card">
                    <a href="/partner-onboarding.html"><button class="secondary" type="button">Partner onboarding</button></a>
                </div>

                <div class="card">
                    <a href="/admin-dashboard.html"><button class="secondary" type="button">Admin dashboard</button></a>
                </div>
            </div>

            <div class="footerHint"></div>
        </div>
    </div>
</div>
</body>
</html>
