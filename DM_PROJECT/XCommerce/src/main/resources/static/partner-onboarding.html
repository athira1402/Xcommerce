<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Partner Onboarding - XCommerce</title>
    <style>
      :root {
        --bg: #fff4f6;
        --bg2: #fff;
        --text: #111827;
        --muted: #6b7280;
        --border: rgba(17, 24, 39, 0.08);
        --shadow: 0 10px 30px rgba(17, 24, 39, 0.08);
        --shadow2: 0 6px 18px rgba(17, 24, 39, 0.08);
        --brand: #ff3f6c;
        --brand2: #ff7a59;
        --chip: rgba(255, 63, 108, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
          Arial, "Noto Sans", "Liberation Sans", sans-serif;
        margin: 0;
        color: var(--text);
        background: radial-gradient(1200px 700px at 15% -5%, #ffe2ea 0%, rgba(255, 226, 234, 0) 55%),
          radial-gradient(900px 550px at 85% 5%, #ffe7df 0%, rgba(255, 231, 223, 0) 45%),
          linear-gradient(180deg, #fff 0%, #fff4f6 75%, #fff 100%);
        font-size: 16px;
      }

      .topbar {
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(255, 255, 255, 0.72);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border);
      }

      .topbarInner {
        max-width: 1100px;
        margin: 0 auto;
        padding: 18px 26px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .logo {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--brand) 0%, var(--brand2) 100%);
        box-shadow: 0 8px 20px rgba(255, 63, 108, 0.25);
      }

      .brandTitle {
        display: grid;
        line-height: 1.1;
      }

      .brandTitle strong {
        font-size: 20px;
        letter-spacing: 0.2px;
      }

      .brandTitle span {
        font-size: 13px;
        color: var(--muted);
      }

      .pill {
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.9);
        border-radius: 999px;
        padding: 8px 12px;
        color: var(--muted);
        font-size: 12px;
      }

      .page {
        max-width: 1100px;
        margin: 0 auto;
        padding: 22px 26px 34px;
      }

      .layout {
        display: grid;
        grid-template-columns: 1fr;
        gap: 18px;
        align-items: start;
        max-width: 820px;
        margin: 0 auto;
      }

      @media (max-width: 980px) {
        .layout {
          grid-template-columns: 1fr;
        }
      }

      .panel {
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow2);
        overflow: hidden;
      }

      .panelHead {
        padding: 16px 16px 10px;
        border-bottom: 1px solid var(--border);
      }

      h1 {
        margin: 0;
        font-size: 20px;
        letter-spacing: 0.1px;
      }

      p.sub {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .panelBody {
        padding: 14px 16px 16px;
      }

      form {
        display: grid;
        gap: 16px;
      }

      label {
        display: block;
        font-size: 12px;
        color: #374151;
        margin-bottom: 6px;
        font-weight: 650;
        letter-spacing: 0.2px;
      }

      input {
        width: 100%;
        font-size: 14px;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.92);
        outline: none;
      }

      input[type="file"] {
        display: none;
      }

      input:focus {
        border-color: rgba(255, 63, 108, 0.55);
        box-shadow: 0 0 0 3px rgba(255, 63, 108, 0.14);
      }

      .actions {
        display: flex;
        gap: 16px;
        align-items: center;
        margin-top: 12px;
      }

      .fileRow {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 12px;
        align-items: stretch;
      }

      .fileBtn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.95);
        color: var(--text);
        cursor: pointer;
        font-weight: 750;
        font-size: 14px;
        letter-spacing: 0.1px;
        user-select: none;
        min-height: 44px;
      }

      .fileBtn:hover {
        border-color: rgba(255, 63, 108, 0.55);
        box-shadow: 0 0 0 3px rgba(255, 63, 108, 0.10);
      }

      .fileName {
        display: flex;
        align-items: center;
        min-height: 44px;
        font-size: 12px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      button {
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid rgba(255, 63, 108, 0.55);
        background: linear-gradient(135deg, var(--brand) 0%, var(--brand2) 100%);
        color: white;
        cursor: pointer;
        font-weight: 750;
        letter-spacing: 0.1px;
        box-shadow: 0 10px 18px rgba(255, 63, 108, 0.2);
      }

      button.secondary {
        background: rgba(255, 255, 255, 0.95);
        color: var(--text);
        border: 1px solid var(--border);
        box-shadow: none;
      }

      button:disabled {
        opacity: 0.65;
        cursor: not-allowed;
        box-shadow: none;
      }

      .status {
        font-size: 13px;
        color: #374151;
        white-space: pre-wrap;
        margin-top: 10px;
      }

      .error {
        color: #b91c1c;
      }

      .ok {
        color: #047857;
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <div class="topbarInner">
        <div class="brand">
          <div class="logo"></div>
          <div class="brandTitle">
            <strong>XCommerce</strong>
            <span>Partner onboarding</span>
          </div>
        </div>
        <div class="pill">Upload RDF for review</div>
      </div>
    </div>

    <div class="page">
      <div class="layout">
        <div class="panel">
          <div class="panelHead">
            <h1>Submit your RDF</h1>
            <p class="sub">Upload your RDF file for review. After admin approval, your data and mapping will be added to Fuseki.</p>
          </div>
          <div class="panelBody">
            <form id="f">
              <div>
                <label>Partner name</label>
                <input id="partnerName" type="text" placeholder="Amazon" required />
              </div>

              <div>
                <label>RDF file</label>
                <div class="fileRow">
                  <label class="fileBtn" for="rdf">Choose file</label>
                  <div id="rdfName" class="fileName">No file selected</div>
                </div>
                <input id="rdf" type="file" accept=".rdf,.ttl,.nt,.n3,.owl,application/rdf+xml,text/turtle" required />
              </div>

              <div class="actions">
                <button id="btn" type="submit">Upload</button>
                <a href="/admin-dashboard.html" style="text-decoration:none;"><button class="secondary" type="button">Admin dashboard</button></a>
                <a href="/product-search.html" style="text-decoration:none;"><button class="secondary" type="button">Back</button></a>
              </div>

              <div id="status" class="status"></div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script>
      const form = document.getElementById('f');
      const btn = document.getElementById('btn');
      const status = document.getElementById('status');
      const rdfInput = document.getElementById('rdf');
      const rdfName = document.getElementById('rdfName');

      function setStatus(text, ok) {
        status.textContent = text;
        status.className = 'status ' + (ok ? 'ok' : 'error');
      }

      rdfInput.addEventListener('change', () => {
        const f = rdfInput.files && rdfInput.files[0];
        rdfName.textContent = f ? f.name : 'No file selected';
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        btn.disabled = true;
        status.textContent = '';

        try {
          const partnerName = document.getElementById('partnerName').value;
          const file = document.getElementById('rdf').files[0];
          const fd = new FormData();
          fd.append('partnerName', partnerName);
          fd.append('rdf', file);

          const res = await fetch('/partners/upload', { method: 'POST', body: fd });
          const txt = await res.text();
          if (!res.ok) {
            setStatus(txt || ('Upload failed: ' + res.status), false);
            return;
          }
          setStatus('Uploaded successfully.', true);
        } catch (err) {
          setStatus(String(err), false);
        } finally {
          btn.disabled = false;
        }
      });
    </script>
  </body>
</html>
